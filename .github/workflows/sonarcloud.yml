name: sonarcloud

# Análisis CI que SÍ respeta sonar-project.properties (NCLOC real ~14k).
# Requiere:
#   1) Secret SONAR_TOKEN en el repo
#   2) Desactivar Automatic Analysis en SonarCloud:
#      Proyecto → Administration → Analysis Method → Automatic Analysis OFF
# Si Automatic Analysis sigue ON, este job fallará a propósito (conflicto Sonar).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
