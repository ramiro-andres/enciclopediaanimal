name: Desplegar en GitHub Pages

# US-DEV-10 — Gate de deploy: solo se despliega si CI (test + e2e) está verde.
# En lugar de disparar el deploy directamente en cada push a main (que permitía
# publicar con `test` rojo o la app rota, ver PR #21), el deploy se dispara al
# COMPLETARSE los workflows de calidad y verifica que AMBOS (test y e2e) hayan
# terminado en éxito para el mismo commit antes de publicar.
on:
  workflow_run:
    workflows: ["test", "e2e"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Puerta de calidad: confirma que test y e2e estén verdes para el commit.
  # Condiciones de origen (rama/repo/fork) van en `if:` — no en el shell (S7630).
  gate:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: Verificar CI verde (test + e2e) para este commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA_FALLBACK: ${{ github.sha }}
          TRIGGER_NAME: ${{ github.event.workflow_run.name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Despliegue manual solicitado."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "sha=$GITHUB_SHA_FALLBACK" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Disparado por '$TRIGGER_NAME' para $RUN_SHA"
          echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"

          if [[ ! "$RUN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "SHA inválido: $RUN_SHA"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          conclusion_for() {
            local name="$1"
            gh api --paginate \
              "repos/$REPO/actions/runs?head_sha=$RUN_SHA&branch=main&status=completed" \
              --jq "[.workflow_runs[] | select(.name==\"$name\")] | sort_by(.run_started_at) | last | .conclusion // \"pending\""
          }

          TEST_CONCL="$(conclusion_for "test")"
          E2E_CONCL="$(conclusion_for "e2e")"
          echo "test=$TEST_CONCL · e2e=$E2E_CONCL"

          if [[ "$TEST_CONCL" == "success" && "$E2E_CONCL" == "success" ]]; then
            echo "Ambos workflows de calidad están verdes: se procede al despliegue."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Aún no están verdes ambos workflows (test=$TEST_CONCL, e2e=$E2E_CONCL)."
            echo "Se desplegará cuando el otro workflow termine en éxito para este commit."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: ${{ needs.gate.outputs.should_deploy == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      # Solo main (rama confiable). No se hace checkout de un SHA externo (S7631).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Confirmar que main apunta al SHA validado por el gate
        env:
          DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          TIP="$(git rev-parse HEAD)"
          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "SHA inválido: $DEPLOY_SHA"
            exit 1
          fi
          if [[ "$TIP" != "$DEPLOY_SHA" ]]; then
            echo "main tip ($TIP) != SHA del gate ($DEPLOY_SHA)."
            echo "Otro commit llegó a main; este deploy se omite (correrá el del tip)."
            exit 1
          fi
          echo "Desplegando $TIP"

      - name: Configurar Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Preparar sitio estático
        run: |
          ruby scripts/data/build_sitemap.rb
          mkdir -p _site
          cp index.html .nojekyll manifest.webmanifest sw.js sitemap.xml robots.txt _site/
          cp -r css js data images _site/
          du -sh _site
          find _site -type f | wc -l

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      - name: Verificar sitio publicado (F4-06)
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Comprobando $PAGE_URL"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PAGE_URL")
            if [[ "$STATUS" == "200" ]]; then
              echo "Sitio responde HTTP 200"
              exit 0
            fi
            echo "Intento $i: HTTP $STATUS — reintentando en 10s..."
            sleep 10
          done
          echo "El sitio no respondió HTTP 200 tras el despliegue"
          exit 1
