name: Desplegar en GitHub Pages

# US-DEV-10 — Gate de deploy: solo se despliega si CI (test + e2e) está verde.
# En lugar de disparar el deploy directamente en cada push a main (que permitía
# publicar con `test` rojo o la app rota, ver PR #21), el deploy se dispara al
# COMPLETARSE los workflows de calidad y verifica que AMBOS (test y e2e) hayan
# terminado en éxito para el mismo commit antes de publicar.
on:
  workflow_run:
    workflows: ["test", "e2e"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Puerta de calidad: confirma que test y e2e estén verdes para el commit.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: Verificar CI verde (test + e2e) para este commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA_FALLBACK: ${{ github.sha }}
          # Valores de workflow_run vía env (no interpolar en el script: S7630).
          TRIGGER_NAME: ${{ github.event.workflow_run.name }}
          TRIGGER_CONCL: ${{ github.event.workflow_run.conclusion }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          set -euo pipefail

          # Despliegue manual (workflow_dispatch): se permite siempre desde main.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Despliegue manual solicitado."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "sha=$GITHUB_SHA_FALLBACK" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Disparado por '$TRIGGER_NAME' (conclusión: $TRIGGER_CONCL) para $RUN_SHA"
          echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"

          # Solo desplegar commits del propio repo en main (nunca forks).
          if [[ "$HEAD_REPO" != "$REPO" || "$HEAD_BRANCH" != "main" ]]; then
            echo "Origen no confiable (repo=$HEAD_REPO branch=$HEAD_BRANCH); no se despliega."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$RUN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "SHA inválido: $RUN_SHA"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$TRIGGER_CONCL" != "success" ]]; then
            echo "El workflow '$TRIGGER_NAME' no fue exitoso; no se despliega."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Conclusión del último run COMPLETADO de un workflow para este SHA.
          conclusion_for() {
            local name="$1"
            gh api --paginate \
              "repos/$REPO/actions/runs?head_sha=$RUN_SHA&branch=main&status=completed" \
              --jq "[.workflow_runs[] | select(.name==\"$name\")] | sort_by(.run_started_at) | last | .conclusion // \"pending\""
          }

          TEST_CONCL="$(conclusion_for "test")"
          E2E_CONCL="$(conclusion_for "e2e")"
          echo "test=$TEST_CONCL · e2e=$E2E_CONCL"

          if [[ "$TEST_CONCL" == "success" && "$E2E_CONCL" == "success" ]]; then
            echo "Ambos workflows de calidad están verdes: se procede al despliegue."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Aún no están verdes ambos workflows (test=$TEST_CONCL, e2e=$E2E_CONCL)."
            echo "Se desplegará cuando el otro workflow termine en éxito para este commit."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: ${{ needs.gate.outputs.should_deploy == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      # Checkout de main (rama confiable). El SHA de deploy se fija después
      # de validar que es ancestro de origin/main (mitiga S7631 / forks).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fijar commit de despliegue verificado
        env:
          DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "SHA inválido: $DEPLOY_SHA"
            exit 1
          fi
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/main
          git checkout --detach "$DEPLOY_SHA"
          echo "Desplegando $(git rev-parse HEAD)"

      - name: Configurar Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Preparar sitio estático
        run: |
          ruby scripts/data/build_sitemap.rb
          mkdir -p _site
          cp index.html .nojekyll manifest.webmanifest sw.js sitemap.xml robots.txt _site/
          cp -r css js data images _site/
          du -sh _site
          find _site -type f | wc -l

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      - name: Verificar sitio publicado (F4-06)
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Comprobando $PAGE_URL"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PAGE_URL")
            if [[ "$STATUS" == "200" ]]; then
              echo "Sitio responde HTTP 200"
              exit 0
            fi
            echo "Intento $i: HTTP $STATUS — reintentando en 10s..."
            sleep 10
          done
          echo "El sitio no respondió HTTP 200 tras el despliegue"
          exit 1
