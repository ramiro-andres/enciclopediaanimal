sonar.projectKey=ramiro-andres_enciclopediaanimal
sonar.organization=ramiro-andres
sonar.projectName=enciclopediaanimal

# Solo código de producto: UI, estilos y workers.
# Datos generados, scripts one-shot, docs y assets quedan fuera del NCLOC.
sonar.sources=index.html,css,js,sw.js,manifest.webmanifest
sonar.tests=tests
sonar.test.inclusions=tests/**/*
sonar.exclusions=\
  images/**,\
  **/*.jpg,\
  **/*.jpeg,\
  **/*.png,\
  **/*.gif,\
  **/*.webp,\
  **/*.svg,\
  **/*.ico,\
  **/*.avif,\
  data/**,\
  docs/**,\
  scripts/**,\
  sitemap.xml,\
  _site/**,\
  node_modules/**,\
  package-lock.json,\
  **/*.md

sonar.sourceEncoding=UTF-8
